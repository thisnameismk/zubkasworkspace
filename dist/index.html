<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="All-in-One Business OS: Invoicing, Accounting & Project Management" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  </head>
  <body>
    <script>
      // Apply saved accent color + theme before first paint to prevent flash
      (function () {
        try {
          var stored = localStorage.getItem('zt-app-settings');
          if (stored) {
            var settings = JSON.parse(stored);
            var hex = '#9f0f0f';
            if (settings.accent === 'custom' && settings.customAccent) {
              hex = settings.customAccent;
            } else if (settings.accent) {
              var presets = { blue: '#0ea5e9', teal: '#0d9488', emerald: '#059669', indigo: '#4f46e5' };
              if (presets[settings.accent]) hex = presets[settings.accent];
            }
            // Convert hex to HSL
            var r = parseInt(hex.slice(1, 3), 16) / 255;
            var g = parseInt(hex.slice(3, 5), 16) / 255;
            var b = parseInt(hex.slice(5, 7), 16) / 255;
            var max = Math.max(r, g, b), min = Math.min(r, g, b);
            var h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
              var d = max - min;
              s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
              switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
              }
              h /= 6;
            }
            var hsl = Math.round(h * 360) + ' ' + Math.round(s * 100) + '% ' + Math.round(l * 100) + '%';
            var root = document.documentElement;
            root.style.setProperty('--primary', hsl);
            root.style.setProperty('--ring', hsl);
            root.style.setProperty('--accent', hsl);
            root.style.setProperty('--chart-1', hsl);
          }
          // Apply saved theme
          var theme = localStorage.getItem('zt-theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
